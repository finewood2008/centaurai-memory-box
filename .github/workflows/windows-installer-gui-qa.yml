name: Windows installer graphical validation

on:
  push:
    branches: [codex/memobox-windows-installer-gui-qa]

permissions:
  contents: read

jobs:
  graphical-validation:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/memobox-windows-installer-art
          sparse-checkout: |
            .github/scripts
            wanx/apps/personal-client/resources/installer
            wanx/apps/personal-client/shell
            wanx/apps/personal-client/tools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile the test installer from production hooks
        shell: pwsh
        run: |
          $toolchain = Join-Path "$env:RUNNER_TEMP" 'toolchain'
          npm install --prefix "$toolchain" --no-audit --no-fund app-builder-lib@26.15.3
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned NSIS toolchain' }
          New-Item -ItemType Junction -Path 'wanx/apps/personal-client/node_modules' -Target "$toolchain/node_modules" | Out-Null
          $script = 'wanx/apps/personal-client/tools/verify-installer-ui.mjs'
          $old = '  ${uninstall ? "" : "!insertmacro customInstall"}'
          $addition = @'
          ${uninstall ? "" : `SetOutPath "$INSTDIR"
          FileOpen $0 "$INSTDIR\\WANX.exe" w
          FileWrite $0 "installer-test-fixture"
          FileClose $0
          SetOutPath "$INSTDIR\\resources"
          FileOpen $0 "$OUTDIR\\app.asar" w
          FileWrite $0 "installer-test-fixture"
          FileClose $0
          !insertmacro customInstall
          Sleep 11000`}
          '@
          $text = Get-Content -Raw $script
          if (-not $text.Contains($old)) { throw 'Cannot prepare compile-check fixture' }
          $text.Replace($old, $addition) | Set-Content -Encoding utf8 $script
          node $script "$env:RUNNER_TEMP/fixture"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture did not compile' }
      - name: Inspect the real native dialog using the lightweight fixture
        shell: powershell
        run: .github/scripts/windows-installer-gui-qa.ps1 -Installer "$env:RUNNER_TEMP/fixture/install-compile-check.exe" -OutputPath "$env:RUNNER_TEMP/memobox-gui-qa" -OverviewBitmap "wanx/apps/personal-client/resources/installer/illustrated/windows-overview.bmp"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memobox-windows-installer-fixture
          path: ${{ runner.temp }}/memobox-gui-qa/
          if-no-files-found: error
