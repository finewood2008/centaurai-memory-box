[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "wanx-media-processing"
version = "0.1.0"
description = "Box-local, permission-scoped media processing"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30", "PyJWT[crypto]>=2.8,<3", "pillow>=11"]

[project.optional-dependencies]
heif = ["pillow-heif>=1.0,<2"]
asr = ["faster-whisper>=1.1,<2"]
streaming = ["numpy>=1.26,<3", "sherpa-onnx==2.0.3", "websockets>=12,<17"]
vision = ["transformers>=4.45,<5", "torch>=2.4", "safetensors>=0.4"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
wanx-media = "wanx_media.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["wanx_media"]
