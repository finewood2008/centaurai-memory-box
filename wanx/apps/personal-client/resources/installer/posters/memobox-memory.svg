<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><rect width="720" height="400" fill="#f5efe5"/><rect x="15" y="15" width="690" height="370" rx="20" fill="#fffcf7" stroke="#ded1be"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#40362b"><text x="42" y="49" font-size="16" font-weight="600">半人马AI记忆盒子</text><text x="42" y="73" font-size="10" letter-spacing="1.7" fill="#8d7962">CENTAURAI MEMOBOX</text><text x="42" y="126" font-size="13" fill="#9b7956">记忆</text><text x="42" y="168" font-size="30" font-weight="600">留下值得记住的协作</text><text x="42" y="199" font-size="14" fill="#827260">整理支持来源中的记忆，让下一次任务有据可循。</text><rect x="42" y="230" width="202" height="119" rx="12" fill="#f4ede1"/><text x="59" y="258" font-size="12" fill="#9b7956">01</text><text x="59" y="291" font-size="19" font-weight="600">接入来源</text><text x="59" y="320" font-size="12" fill="#827260">按应用检查采集状态</text><rect x="258" y="230" width="202" height="119" rx="12" fill="#f4ede1"/><text x="275" y="258" font-size="12" fill="#9b7956">02</text><text x="275" y="291" font-size="19" font-weight="600">整理记忆</text><text x="275" y="320" font-size="12" fill="#827260">查看、查找与核对内容</text><rect x="474" y="230" width="202" height="119" rx="12" fill="#f4ede1"/><text x="491" y="258" font-size="12" fill="#9b7956">03</text><text x="491" y="291" font-size="19" font-weight="600">继续任务</text><text x="491" y="320" font-size="12" fill="#827260">选择允许使用的资料</text></g></svg>